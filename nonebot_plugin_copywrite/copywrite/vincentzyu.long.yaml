  examples:
    - |
      真拿你没办法，坐好喽。
      那是 CS 职业赛场上，一记足以载入 CNCS 记忆的冷枪。

      赛场寂静得只剩下鼠标点击与呼吸声。TYLOO 深陷经济绝境，全员半甲残装，几乎是赤手空拳面对当时如日中天的世界第一战队 Vitality。
      对面是被称为怪物的 ZywOo，此时他正站在 CS 巅峰，反应、定位、威慑力都几乎无解，是所有狙击手的噩梦。他前压控场，姿态从容，仿佛一切尽在掌握。

      谁也不会想到，这一步会撞上来自东方的致命瞄准。DANK1NG 静步干拉、目光如钉，没有多余动作，没有花哨身法，只有一瞬的屏息瞄准。
      枪响的瞬间，尘埃未落。一发轻盈却决绝的子弹，越过战场喧嚣，精准穿过 ZywOo 的头颅。世界第一应声倒地，全场哗然。

      那不是依靠火力碾压的胜利，而是极致瞄准与绝对冷静的胜利。
      一把廉价鸟狙，一颗普通子弹，一位中国选手，在最绝望的局里，狙杀了当时不可一世的天才。这一枪没有改写整场战局，却在无数观众心里刻下了一句话：

      再强的神，也会被凡人一枪封喉。它轻得像一阵风，却重得像一座碑。
