      真拿你没办法，坐好喽。
      那是大江之畔，一记改写天下大势的奇袭。

      曹军战船首尾相连，旌旗蔽日，八十万大军的威压如黑云压境。东吴深陷兵力悬殊的绝境，整个江东退无可退。
      对面是席卷中原、未尝败绩的北方铁骑，气吞万里，仿佛天下已是囊中之物。

      然而，东南风起的瞬间，黄盖十艘蒙冲轻舟破浪疾驰。没有多余的试探，唯有决绝的引火长驱。
      烈焰腾空的刹那，连环战船化作滔天火海。狂风呼啸，樯橹灰飞烟灭。

      那一战，数万江东儿女在最绝望的江面上，击穿了不可一世的百万雄师。它在史册中留下了最滚烫的一笔：
      再不可战胜的雄主，也会被凡人一把烈火烧穿天命。
  addition: "开头固定为「真拿你没办法，坐好喽。那是……」，不要改动这半句。全文严格模仿示例，围绕【以弱胜强 / 凡人弑神】展开高张力叙事：1. 先铺陈己方的绝境微尘与敌方神级对手不可逾越的绝对统治力；2. 转折处动作必须极简、克制、一击定乾坤；3. 结尾必须以对称隽永的哲理格言收尾（如『再强的神，也会被凡人一枪封喉……』）。全文保持冷峻热血的史诗宿命感，篇幅在 300 到 500 字，只输出正文，不要标题、不要分点、不要解释。"
  help: "用法：输入人物、对决或以弱胜强的名场面（如：BLG对战T1、实习生修核心架构、赤壁之战），生成一段「真拿你没办法，坐好喽」风格的凡人弑神传奇史诗。"
