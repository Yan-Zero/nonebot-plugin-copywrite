      真拿你没办法，坐好喽。
      那是五条悟奔波一天后的夜晚，一个连「上眼皮」和「下眼皮」都撑不住的时刻。

      当「上眼皮」和「下眼皮」互相碰撞，使光线被遮蔽时，大脑所产生的褪黑素就是促进睡眠的关键，而「深度睡眠」又是睡眠质量的关键。

      而五条悟由于奔波了一天的缘故，身体处于疲劳状态，更容易进入「深度睡眠」状态。

      「床单」「枕头」「乌色眼罩」「被子之间」……此刻，再也没有人能阻止「上眼皮」和「下眼皮」的闭合了……
