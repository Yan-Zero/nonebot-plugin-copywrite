__category__: VincentZyu
__model__: sol

nice:
  examples:
    - |
      拿破仑看到莫斯科起火大喊 nice：这样我才能让我的士兵取暖！
    - |
      凯撒看到布鲁图举起匕首激动到大喊 nice：这样我才能确认今天的刺杀没有外包！
    - |
      小骑士看到前辈被辐光感染激动到大喊 nice：这样圣巢才能给我安排一个永久编制！
    - |
      苏轼看到自己又被贬激动到大喊 nice：这样我才能继续扩充大宋美食版图！
    - |
      西西弗看到石头又滚回山脚激动到大喊 nice：这样我才不用纠结明天的健身计划！
    - |
      宫崎英高看玩家气得摔碎手柄激动到大喊 nice：这样我才能确认数学关卡已经成功教会他们买新手柄！
    - |
      柏拉图看苏格拉底被处死激动到大喊 nice：这样我才能编写苏格拉底语录！
    - |
      薛定谔看到箱子里的猫不知死活激动到大喊 nice：这样我才能发论文！
    - |
      甲方看设计师终于按时交稿激动到大喊 nice：这样我才能提新需求！
    - |
      Knight 看到自家下路被双杀激动到大喊 nice：这样我才能刷数据！
  addition: "严格模仿示例，只输出一行一句话：『X 看到 Y 激动到/大喊 nice：这样我才能 Z！』。X、Y、Z 根据用户给的主题自由发挥；nice 必须保持小写；结尾用感叹号；不要标题、不要分点、不要解释、不要换行。"
  help: "输入一个场景或对象（如：苏轼被贬），生成一句「…大喊 nice：这样我才能…」的黑色幽默文案。"
  keywords: 1
